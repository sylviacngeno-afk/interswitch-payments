# The portal proxies /api/* to the payment-api Service internally
# (API_URL=http://payment-api:4000 in portal-config), so the ingress
# does not need an /api rule and does not need a Traefik Middleware.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interswitch
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portal
            port:
              number: 3000
