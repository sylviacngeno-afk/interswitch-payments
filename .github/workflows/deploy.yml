name: Build and Deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

env:
  PORTAL_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/interswitch-portal
  API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/interswitch-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Derive an image tag from the commit SHA
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the portal image
        run: |
          docker build -t $PORTAL_IMAGE:$TAG -t $PORTAL_IMAGE:latest .
          docker push $PORTAL_IMAGE:$TAG
          docker push $PORTAL_IMAGE:latest

      - name: Build and push the payment-api image
        run: |
          docker build -t $API_IMAGE:$TAG -t $API_IMAGE:latest ./payment-api
          docker push $API_IMAGE:$TAG
          docker push $API_IMAGE:latest

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install interswitch-release ./chart \
            --set portal.image.repository=${{ env.PORTAL_IMAGE }} \
            --set portal.image.tag=${{ env.TAG }} \
            --set paymentApi.image.repository=${{ env.API_IMAGE }} \
            --set paymentApi.image.tag=${{ env.TAG }} \
            --atomic \
            --timeout 5m
