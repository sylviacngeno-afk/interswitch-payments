name: Build and Deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

env:
  PORTAL_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/interswitch-portal
  API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/interswitch-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Derive an image tag from the commit SHA
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the portal image
        run: |
          docker build -t $PORTAL_IMAGE:$TAG -t $PORTAL_IMAGE:latest .
          docker push $PORTAL_IMAGE:$TAG
          docker push $PORTAL_IMAGE:latest

      - name: Build and push the payment-api image
        run: |
          docker build -t $API_IMAGE:$TAG -t $API_IMAGE:latest ./payment-api
          docker push $API_IMAGE:$TAG
          docker push $API_IMAGE:latest

      - name: Copy the manifests to the cluster
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/*"
          target: "/home/ubuntu/interswitch"

      - name: Apply the manifests and roll out the new images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true          # a failed command now fails the job
          script: |
            set -euo pipefail
            cd /home/ubuntu/interswitch

            kubectl apply -f k8s/

            kubectl set image deployment/portal \
              portal=${{ env.PORTAL_IMAGE }}:${{ env.TAG }}
            kubectl set image deployment/payment-api \
              api=${{ env.API_IMAGE }}:${{ env.TAG }}

            kubectl rollout status deployment/portal --timeout=150s
            kubectl rollout status deployment/payment-api --timeout=150s

            kubectl get pods -o wide

      - name: Show why the rollout failed
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl get pods -o wide
            kubectl describe pods -l app=payment-api | sed -n '/Events/,$p'
            kubectl describe pods -l app=portal | sed -n '/Events/,$p'
