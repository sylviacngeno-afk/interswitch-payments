name: Interswitch Portal CI/CD

on:
  push:
    branches:
      - main

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check files
        run: ls -la


  deploy:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Deploy
        run: echo "Deploying..."
        env:
          HOST: ${{ secrets.EC2_HOST }}
