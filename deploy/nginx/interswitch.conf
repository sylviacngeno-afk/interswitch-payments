# Front door for the interswitch stack.
#
# This cluster runs k3s with no ingress controller, so nginx on the node
# terminates :80 and proxies to the portal's NodePort. The portal serves
# the web UI and proxies /api/* to the payment-api Service internally
# (API_URL=http://payment-api:4000), so a single upstream is enough.
#
# Install on the node:
#   sudo cp deploy/nginx/interswitch.conf /etc/nginx/sites-available/interswitch
#   sudo ln -sf /etc/nginx/sites-available/interswitch /etc/nginx/sites-enabled/interswitch
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream interswitch_portal {
    server 127.0.0.1:30080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/interswitch.access.log;
    error_log  /var/log/nginx/interswitch.error.log;

    location / {
        proxy_pass http://interswitch_portal;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
